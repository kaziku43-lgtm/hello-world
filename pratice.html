<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drink Card</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fdf2f8, #fef3c7);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 900px;
        }

        h1 {
            color: #5b2c6f;
            margin-bottom: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
        }

        .cat-card {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            background: white;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .cat-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
        }

        .cat-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .cat-card:hover img {
            transform: scale(1.08);
        }

        .cat-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-weight: bold;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .cat-card:hover .cat-name {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cat Pictures</h1>
        <div class="gallery">
            <div class="cat-card">
                <img src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?auto=format&fit=crop&w=800&q=80" alt="Milo">
                <div class="cat-name">Milo</div>
            </div>
            <div class="cat-card">
                <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?auto=format&fit=crop&w=800&q=80" alt="Luna">
                <div class="cat-name">Luna</div>
            </div>
            <div class="cat-card">
                <img src="https://images.unsplash.com/photo-1536590158209-eef6d3d72cd4?auto=format&fit=crop&w=800&q=80" alt="Simba">
                <div class="cat-name">Simba</div>
            </div>
            <div class="cat-card">
                <img src="https://images.unsplash.com/photo-1574158622682-e40e69881006?auto=format&fit=crop&w=800&q=80" alt="Oreo">
                <div class="cat-name">Oreo</div>
            </div>
            <div class="cat-card">
                <img src="https://images.unsplash.com/photo-1543852786-1cf6624b9987?auto=format&fit=crop&w=800&q=80" alt="Nala">
                <div class="cat-name">Nala</div>
            </div>
        </div>
    </div>
</body>
</html>
